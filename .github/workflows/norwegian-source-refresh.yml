# Repository destination: .github/workflows/norwegian-source-refresh.yml
# Deploy only after the hosted-runner ordinary-request probe passes.
name: Refresh public Norwegian sailing schedules

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/norwegian-source-refresh.yml
      - tools/norwegian/**

permissions:
  contents: write

concurrency:
  group: norwegian-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # verified v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # verified v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collect and strictly validate public schedule facts
        run: python tools/norwegian/github-collect.py --output data/norwegian-sailings.json
      - name: Commit only the validated public feed
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/norwegian-sailings.json
          if git diff --cached --quiet -- data/norwegian-sailings.json; then
            echo 'No feed changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public Norwegian sailing schedules'
          git push origin HEAD:main
          # Successful source timestamps change on each run, so these real feed
          # commits also keep repository activity current. No keepalive writes.
